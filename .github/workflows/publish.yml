name: Publish npm packages

on:
  push:
    tags:
      - 'npm-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish core and functions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify release tag
        shell: bash
        run: |
          core_version=$(node -p "require('./packages/core/package.json').version")
          functions_version=$(node -p "require('./packages/functions/package.json').version")
          expected_tag="npm-v${core_version}"

          if [[ "$core_version" != "$functions_version" ]]; then
            echo "::error::core (${core_version}) and functions (${functions_version}) versions differ"
            exit 1
          fi

          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} must equal ${expected_tag}"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build packages
        run: |
          pnpm --filter @magicskysword/openfairygui-core build
          pnpm --filter @magicskysword/openfairygui-functions build

      - name: Publish core
        shell: bash
        run: |
          package_version=$(node -p "require('./packages/core/package.json').version")
          if npm view "@magicskysword/openfairygui-core@${package_version}" version >/dev/null 2>&1; then
            echo "@magicskysword/openfairygui-core@${package_version} is already published"
          else
            npm publish ./packages/core --access public
          fi

      - name: Publish functions
        shell: bash
        run: |
          package_version=$(node -p "require('./packages/functions/package.json').version")
          if npm view "@magicskysword/openfairygui-functions@${package_version}" version >/dev/null 2>&1; then
            echo "@magicskysword/openfairygui-functions@${package_version} is already published"
          else
            npm publish ./packages/functions --access public
          fi
